[pytest]
# pytest configuration for ha-notify-subscriptions
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
# Add custom_components and the repo root to PYTHONPATH for imports
pythonpath = custom_components .
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
