# `pre-commit install` sets up both git hooks:
#   pre-commit — fast checks on the changed files (whitespace, yaml, ruff)
#   pre-push   — scripts/check.sh push: mypy, pytest and hassfest, like CI
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v3.2.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-yaml
  - id: check-added-large-files
    args: [--maxkb=30000]
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.14.6
  hooks:
  - id: ruff-check
    args: [--fix]
  - id: ruff-format
- repo: local
  hooks:
  - id: push-checks
    name: mypy + pytest + hassfest
    entry: scripts/check.sh push
    language: system
    pass_filenames: false
    always_run: true
    stages: [pre-push]
